services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=dev
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - JWT_SECRET=${JWT_KEY:-nestch}
      - JWT_ALGORITHM=${ALGORITHM:-HS256}
    depends_on:
      - rabbitmq

  stripe-cli:
    image: stripe/stripe-cli:latest
    env_file:
      - .env
    command: ["listen", "--forward-to", "http://api:8000/webhooks/stripe"]
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY:-}
    depends_on:
      - api

  worker:
    build: .
    command: ["python", "-m", "app.workers.payment_worker"]
    env_file:
      - .env
    environment:
      - APP_ENV=dev
      - JWT_SECRET=${JWT_KEY:-nestch}
      - JWT_ALGORITHM=${ALGORITHM:-HS256}
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=payments
      - RABBITMQ_DEFAULT_PASS=payments
      - RABBITMQ_DEFAULT_VHOST=/

  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=payments
      - MYSQL_USER=payments
      - MYSQL_PASSWORD=payments
      - MYSQL_ROOT_PASSWORD=root
    command: ["--default-authentication-plugin=mysql_native_password"]
